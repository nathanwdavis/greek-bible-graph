- id: known-by-passives
  sql: SELECT t.id, t.ref, t.surface, t.lemma FROM token t WHERE t.lemma IN ('γινώσκω','ἐπιγινώσκω','οἶδα','προγινώσκω')
    AND t.voice = 'passive' ORDER BY t.ord
  rows: 16
  candidates: id
- id: eidos-under-horao
  sql: SELECT t.id, t.ref, t.surface, t.english FROM token t WHERE t.lemma = 'ὁράω' AND list_has_any(t.english_terms,
    ['know']) ORDER BY t.ord
  rows: 22
  candidates: id
- id: unknown-times
  sql: SELECT t.id, t.ref, t.surface FROM token t WHERE t.lemma IN ('οἶδα','γινώσκω','ἐπιγινώσκω') AND
    EXISTS (SELECT 1 FROM token n WHERE n.verse_id = t.verse_id AND n.ord BETWEEN t.ord - 3 AND t.ord
    - 1 AND n.lemma IN ('οὐ','μή','οὐδείς','οὐδέ')) AND EXISTS (SELECT 1 FROM token w WHERE w.verse_id
    = t.verse_id AND w.lemma IN ('ἡμέρα','ὥρα','καιρός','χρόνος','πότε')) ORDER BY t.ord
  rows: 20
  candidates: id
- id: hidden-vocab
  sql: SELECT t.id, t.ref, t.surface, t.lemma FROM token t WHERE t.lemma IN ('κρύπτω','ἀποκρύπτω','ἐγκρύπτω','παρακαλύπτομαι','κρυπτός','ἀπόκρυφος','κρυφαῖος','κρυφῇ','μυστήριον','ἀνεξιχνίαστος','ἀνεξεραύνητος','ἀφανής','ἄγνωστος','καρδιογνώστης')
    ORDER BY t.ord
  rows: 81
  candidates: id
- id: counterfactuals
  query: contrary_to_fact
