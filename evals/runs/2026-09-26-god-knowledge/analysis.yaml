blind_spots:
- 'No semantic domains (Louw-Nida is not openly licensed and is not in this build): recall rests on translator
  glosses (Cherith english_terms) and Clear''s Strong''s-keyed synonym proximity, so a passage about God''s
  knowledge that uses none of the searched words is found only if it was added as a known passage (Matt
  10:29-30, Matt 26:34, John 13:19, 1 Thess 2:4, Heb 4:12 were; others surely were not, e.g. predictions
  of events phrased without a knowing word).'
- 'Referents are words, not entities: the divine-referent filter keeps θεός, πατήρ, κύριος, πνεῦμα, υἱός,
  Ἰησοῦς, Χριστός as lemmas, so it both over-includes (human fathers, masters, an unclean spirit, John''s
  ''my lord'' to an elder) and misses titles (ὁ κρατῶν, ὁ πρῶτος, ὁ ἅγιος, ὁ Ἀμήν in Rev 2-3, found only
  by a separate unfiltered step over Revelation). Similar titles elsewhere may be missed.'
- Upstream lemmatizes the participle εἰδώς under ὁράω (shared Strong's G1492), so οἶδα queries miss it;
  a separate gloss-filtered step over ὁράω recovered 22 such words. Other εἰδ- forms glossed 'see' are
  not covered.
- Contrary-to-fact detection misses elided protases, apodoses without ἄν, and mixed conditionals (per
  the saved query's own notes), so some P passages may be missing.
- 'The Septuagint is absent. The Old Testament texts this taxonomy classically leans on cannot be checked
  here: for P, 1 Sam 23:11-13 (David at Keilah); for A and S, Ps 139, Ps 147:5, Isa 40:28; for D, Isa
  46:9-10; for H, Deut 29:29.'
- Rom 16:25-27 (the doxology on the mystery kept secret for long ages) is not in this edition (gbg resolve
  reports it missing), so it could not be considered.
- Treating Jesus' knowledge (and the risen Christ's in Rev 2-3) as God's knowledge is a theological judgement;
  those passages are flagged in their readings.
- Textual variants are not in this build.
