  reason: 'γνούς: Jesus learned of the plot (12:14). The text presents ordinary awareness, not knowledge
    beyond human means.'
- cite: Matt 12:33
  ids:
  - sblgnt:MAT.12.33
  reason: 'Passive γινώσκεται: a tree is known by its fruit. A human-knowledge proverb.'
- cite: Matt 13:33
  ids:
  - sblgnt:MAT.13.33
  reason: 'ἐγκρύπτω: a woman hides leaven in flour (parable). Not about knowledge.'
- cite: Matt 13:44
  ids:
