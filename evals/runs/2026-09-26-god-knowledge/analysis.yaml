title: God's knowledge and knowledge hidden from humans in the Greek NT
question: Find all passages in the NT that pertain to God's knowledge and what knowledge is hidden from
  humans, and describe each with the taxonomy S, A, P, D, F (K = S ∪ A ∪ P). H is the analyst's added
  label for knowledge hidden from humans.
build: a5bc19c489d1460e
taxonomy:
  labels:
    S: God knows himself.
    A: 'God knows all things actual. Grudem explains this as "all things that exist and all things that
      happen." So: everything that is real, and everything that really happens.'
    P: 'God knows all things possible. Grudem explains this as "events that might happen but that do not
      actually come to pass." So: things that could happen but never do.'
    D: the things God ordains. Ordains is Grudem's word. In this guide it means God decides ahead of time
      that something will happen and makes it certain. God knowing about something, or allowing it, is
      not enough to put it in D.
    F: 'people''s future free choices. This is the part everybody argues about. Grudem describes the kind
      of freedom Arminians want as choices that are "undetermined or uncaused" -- meaning nothing outside
      the person makes the choice happen. F is part of A, because your future choices are things that
      really happen: F ⊆ A (your future free choices are part of "all things actual").'
    H: '[ANALYST''S ADDITION, not in the user''s taxonomy] knowledge hidden from humans: passages saying
      something is hidden from, unknown to, or unknowable by people (including knowledge withheld and
      later disclosed). Added because the question asks for it and the user''s labels have no slot for
      it.'
  implies:
    F:
    - A
