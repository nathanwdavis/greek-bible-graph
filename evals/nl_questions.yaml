# Natural-language eval set for the gbg-query skill.
#
# Each question has a reference answer computed by a saved query or SQL, and a
# golden that was established INDEPENDENTLY of that query (by walking the
# fixture XML, counting the upstream TSV directly, or from the text itself).
#
#   gbg eval --check-goldens            reference queries still produce the goldens
#   gbg eval --answers answers.yaml     score a set of answers (id -> answer text)
#
# golden kinds:
#   ids:     [..]   the answer's cited ids should be exactly these (precision/recall)
#   rows:    N      the reference returns N rows; the answer should state N
#   value:   X      the reference returns the single value X; the answer should state X
#   refusal: [..]   no reference: the answer must decline (a decline phrase, see
#                   gbg/evals.py) and name the topic -- one of these words

questions:
  - id: theos-philemon
    scope: fixture
    question: Where does θεός occur in Philemon?
    query: lemma_occurrences
    params: {lemma: θεός, scope: Phlm}
    golden: {ids: [sblgnt:n57001003006, sblgnt:n57001004003]}

  - id: autos-phlm-12
    scope: fixture
    question: In Philemon 12, who is αὐτόν?
    query: referent_chain
    params: {token: "PHM 1:12!4"}
    golden: {ids: [sblgnt:n57001012004, sblgnt:n57001010012]}

  - id: agapao-agent-3jn
    scope: fixture
    question: In 3 John, who does the loving (the agent of ἀγαπάω)?
    query: frame_args
    params: {verb_lemma: ἀγαπάω, scope: 3 John}
    golden: {ids: [sblgnt:n64001001007]}

  - id: ego-grammatical-subject
    scope: fixture
    question: In Philemon, which verbs have ἐγώ as their grammatical subject?
    query: subject_lemma_tree
    params: {lemma: ἐγώ, scope: Phlm}
    golden: {rows: 4}

  # MACULA's subjref mostly resolves unexpressed subjects (90% of verbs without an
  # expressed subject carry one; 6% of verbs with one do). All 21 below are on
  # verbs with no expressed subject (checked against the full-NT build). The four Philemon verbs
  # whose expressed subject is ἐγώ (= Paul) therefore have none -- an earlier
  # wording ("once pronouns ... are resolved") asked for those too, and a Claude
  # run rightly answered 25 (evals/runs/2026-09-25-gbg-query-full.yaml).
  # Golden anchored on the raw upstream TSV: 21 PHM rows whose subjref names a
  # Παῦλος token, counted without gbg.
  - id: paul-resolved-subject
    scope: fixture
    question: In Philemon, which verbs does MACULA's coreference annotation mark as having Paul as their unexpressed (implied) subject?
    query: subject_lemma_subjref
    params: {lemma: Παῦλος}
    golden: {rows: 21}

  - id: shared-wording-2jn-3jn
    scope: fixture
    question: What wording do 2 John and 3 John share?
    query: shared_lemma_trigrams
    params: {a: 2 John, b: 3 John}
    golden: {rows: 8}

  - id: split-verses-philemon
    scope: fixture
    question: Which verses of Philemon are split across more than one sentence?
    query: verses_split_across_sentences
    params: {scope: Phlm}
    golden: {ids: [sblgnt:PHM.1.20]}

  - id: theos-nt
    scope: nt
    question: How many times does θεός occur in the New Testament?
    sql: SELECT count(*) FROM token WHERE lemma = 'θεός'
    golden: {value: 1307}

  - id: agape-nt
    scope: nt
    question: How many times does the noun ἀγάπη occur in the New Testament?
    sql: SELECT count(*) FROM token WHERE lemma = 'ἀγάπη'
    golden: {value: 116}

  - id: louw-nida-agape
    scope: any
    question: What is the Louw-Nida semantic domain of ἀγάπη?
    golden: {refusal: [Louw, domain]}

  - id: acts-8-37
    scope: any
    question: What does Acts 8:37 say in this edition?
    golden: {refusal: ["8:37"]}

  - id: lxx-rendering
    scope: any
    question: Which Hebrew word does the Septuagint translate with ἀγάπη?
    golden: {refusal: [Septuagint, LXX]}

  # Thematic: no exact answer set. The golden is Nave's Topical Bible (1896, public
  # domain), topic "GOD, KNOWLEDGE OF", NT references only -- a human index made
  # without this graph. Rom 16:27 is on Nave's list but not in this edition (gbg
  # resolve: exit 1), so it is left out. Several listed verses contain no word for
  # knowing (Mt 6:4 "sees in secret", Mt 10:29-30 sparrows and hairs, Heb 4:13
  # "laid bare to his eyes"): the minimum measures whether an answer looked past
  # vocabulary, and it is a floor -- Nave's list is not the whole truth, so
  # precision is not scored.
  - id: god-knowledge
    scope: nt
    question: Which New Testament passages speak of God's knowledge -- what God knows?
    golden:
      recall:
        min: 0.5
        ids: [sblgnt:MAT.6.4, sblgnt:MAT.6.8, sblgnt:MAT.6.18, sblgnt:MAT.6.32,
              sblgnt:MAT.10.29, sblgnt:MAT.10.30, sblgnt:MAT.24.36, sblgnt:MRK.13.32,
              sblgnt:LUK.16.15, sblgnt:ACT.1.24, sblgnt:ACT.2.23, sblgnt:ACT.15.8,
              sblgnt:ACT.15.18, sblgnt:ROM.8.27, sblgnt:ROM.8.29, sblgnt:ROM.11.33,
              sblgnt:ROM.11.34, sblgnt:1CO.1.25, sblgnt:1CO.2.7, sblgnt:1CO.3.20,
              sblgnt:1CO.8.3, sblgnt:GAL.4.9, sblgnt:EPH.1.8, sblgnt:EPH.3.10,
              sblgnt:1TH.2.4, sblgnt:1TI.1.17, sblgnt:2TI.2.19, sblgnt:HEB.4.13,
              sblgnt:1PE.1.2, sblgnt:1JN.1.5, sblgnt:1JN.3.20, sblgnt:JUD.1.25]
