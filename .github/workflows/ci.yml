name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      # Offline by construction: the fixture build needs no network, and the
      # `network` marker (full-NT build from pinned upstream) is excluded in
      # pytest.ini. Run it locally with `pytest -m network`.
      - name: Unit + fixture tests
        run: python -m pytest -q

      - name: Smoke test
        env:
          PYTHON: python
        run: ./smoke_test.sh
